<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicles App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            position: relative;
            min-height: 100vh;
            min-width: 100vw;
            background-color: #2a5a2a;
        }

        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: calc(200vw + 5vw);
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .background-layer {
            position: absolute;
            top: 0;
            width: 100vw;
            height: 100%;
            background-image: url('GrassLand_Example.png');
            background-size: 100vw 100vh;
            background-repeat: no-repeat;
            background-position: center;
        }

        .hitbox {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid blue;
            box-sizing: border-box;
            pointer-events: none;
        }

        .background-layer-1 {
            left: 0;
            animation: scrollRight 20s linear infinite;
        }

        .background-layer-1 .hitbox {
            right: 0;
        }

        .background-layer-2 {
            left: calc(100vw + 5vw);
            animation: scrollRight 20s linear infinite;
        }

        .background-layer-2 .hitbox {
            left: 0;
        }

        .red-line {
            position: absolute;
            left: 100vw;
            top: 0;
            width: 5vw;
            height: 100%;
            background-color: red;
            z-index: 10;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scrollRight 20s linear infinite;
        }

        .red-line-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            color: white;
            font-size: 4vw;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .center-square {
            position: fixed;
            left: 15vw;
            width: 70vw;
            top: 5vh;
            height: min(70vw, 90vh);
            max-height: 90vh;
            background-color: rgba(135, 206, 235, 0.65);
            z-index: 100;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            padding: 2vh 2vw;
            overflow: hidden;
        }

        .bounties-header {
            width: 100%;
            margin-bottom: 2vh;
        }

        .bounties-title-input {
            width: 100%;
            padding: 1vh 1vw;
            font-size: 3vw;
            border: 2px solid #333;
            background-color: white;
            border-radius: 0.5vw;
        }

        .bounties-container {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 2vh;
            min-height: 0;
        }

        .bounty-popup {
            background-color: white;
            padding: 1.5vh 1.5vw;
            margin-bottom: 1vh;
            border-radius: 0.5vw;
            border: 2px solid #333;
            font-size: 2.5vw;
            word-wrap: break-word;
        }

        .bounty-input-container {
            display: flex;
            gap: 1vw;
            align-items: center;
            margin-top: auto;
            flex-shrink: 0;
        }

        .bounty-input {
            flex: 1;
            padding: 1vh 1vw;
            font-size: 2.5vw;
            border: 2px solid #333;
            background-color: #ff0000 !important;
            color: white;
            border-radius: 0.5vw;
            opacity: 1;
            z-index: 101;
        }

        .bounty-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .create-bounty-button {
            padding: 1vh 2vw;
            font-size: 2.5vw;
            background-color: #4CAF50;
            color: white;
            border: 2px solid #333;
            border-radius: 0.5vw;
            cursor: pointer;
            white-space: nowrap;
        }

        .create-bounty-button:hover {
            background-color: #45a049;
        }

        .create-bounty-button:active {
            background-color: #3d8b40;
        }

        .logo-container {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 1000;
            pointer-events: none;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            padding: 0.5vh 0.5vw;
        }

        .sprite-logo {
            max-width: 40vw;
            max-height: 20vh;
            width: auto;
            height: auto;
            margin: 0;
            padding: 0;
            display: block;
        }

        @keyframes scrollRight {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(calc(-100vw - 5vw));
            }
        }
    </style>
</head>
<body>
    <div class="background-container">
        <div class="background-layer background-layer-1">
            <div class="hitbox"></div>
        </div>
        <div class="background-layer background-layer-2">
            <div class="hitbox"></div>
        </div>
        <div class="red-line">
            <div class="red-line-text">don't give up</div>
        </div>
    </div>
    <div class="center-square">
        <div class="bounties-header">
            <input type="text" class="bounties-title-input" value="Bounties" id="bountiesTitle">
        </div>
        <div class="bounties-container" id="bountiesContainer">
            <!-- Bounty popups will appear here -->
        </div>
        <div class="bounty-input-container">
            <input type="text" class="bounty-input" id="bountyInput" placeholder="Enter bounty text...">
            <button class="create-bounty-button" id="createBountyButton">Create Bounty</button>
        </div>
    </div>
    <div class="logo-container">
        <img src="logo.png" alt="Sprite Logo" class="sprite-logo">
    </div>
    <!-- Your content here -->
    <script>
        const createBountyButton = document.getElementById('createBountyButton');
        const bountyInput = document.getElementById('bountyInput');
        const bountiesContainer = document.getElementById('bountiesContainer');

        createBountyButton.addEventListener('click', function() {
            const bountyText = bountyInput.value.trim();
            
            if (bountyText) {
                // Create popup element
                const popup = document.createElement('div');
                popup.className = 'bounty-popup';
                popup.textContent = bountyText;
                
                // Append to container (stacks below each other)
                bountiesContainer.appendChild(popup);
                
                // Clear the input
                bountyInput.value = '';
            }
        });

        // Allow Enter key to create bounty
        bountyInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                createBountyButton.click();
            }
        });
    </script>
</body>
</html>
