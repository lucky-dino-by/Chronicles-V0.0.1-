<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicles App</title>
    <!-- Using FontAwesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            position: relative;
            min-height: 100vh;
            min-width: 100vw;
            background-color: #2a5a2a;
        }

        /* --- Background Animation Setup --- */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .scrolling-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            display: flex;
            width: 210vw; 
            animation: scrollLeft 20s linear infinite;
        }

        .scene-segment {
            position: relative;
            width: 105vw; /* 100vw image + 5vw line */
            height: 100%;
            display: flex;
        }

        .bg-image {
            width: 100vw;
            height: 100%;
            background-image: url('https://raw.githubusercontent.com/lucky-dino-by/Chronicles-V0.0.1-/main/GrassLand_Example.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
        }

        .red-line {
            width: 5vw;
            height: 100%;
            background-color: #D32F2F;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        .red-line-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            color: white;
            font-size: 3vw;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5vh;
            white-space: nowrap;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.5);
            user-select: none;
        }

        @keyframes scrollLeft {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-105vw);
            }
        }

        /* --- Main UI Layout --- */
        .layout-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70vw;
            height: 90vh;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        /* --- Logo Section --- */
        .logo-section {
            flex: 0 1 auto;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 0;
            min-height: 0;
            margin-bottom: -1px;
            z-index: 101;
        }

        .sprite-logo {
            max-width: 100%;
            max-height: 20vh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            transition: all 0.3s ease;
        }

        /* --- Translucent Square --- */
        .center-square {
            position: relative;
            flex: 1 1 auto;
            width: 100%;
            min-height: 0;
            
            background-color: rgba(135, 206, 235, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            padding: 3vh 3vw;
            border-radius: 1vw;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 4px solid #fff;
            pointer-events: auto;
            overflow: hidden;
        }

        /* --- Updated Header with Buttons --- */
        .bounties-header {
            width: 100%;
            margin-bottom: 2vh;
            text-align: center;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1vw;
        }

        .header-btn {
            background: none;
            border: none;
            color: #333;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-btn:hover {
            background-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }

        .bounties-title-input {
            flex-grow: 1;
            padding: 1.5vh;
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            border: none;
            background: transparent;
            color: #333;
            outline: none;
            border-bottom: 3px solid #333;
            min-width: 0; /* Prevents overflow */
        }

        .bounties-container {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 2vh;
            padding-right: 1vw;
            display: flex;
            flex-direction: column;
            gap: 1.5vh;
            min-height: 0;
        }

        .bounties-container::-webkit-scrollbar {
            width: 8px;
        }
        .bounties-container::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
            border-radius: 4px;
        }
        .bounties-container::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
        }

        .bounty-popup {
            background-color: white;
            padding: 2vh 2vw;
            border-radius: 0.8vw;
            border-left: 6px solid #4CAF50;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 1.5rem;
            word-wrap: break-word;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .bounty-popup:hover {
            transform: scale(1.01);
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff4444;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bounty-input-container {
            display: flex;
            gap: 1vw;
            align-items: center;
            margin-top: auto;
            background: white;
            padding: 1vh;
            border-radius: 0.8vw;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .bounty-input {
            flex: 1;
            padding: 1.5vh 1.5vw;
            font-size: 1.2rem;
            border: 2px solid #D32F2F;
            background-color: #ffebee;
            color: #D32F2F;
            border-radius: 0.5vw;
            outline: none;
            font-weight: bold;
            transition: all 0.2s;
        }

        .bounty-input:focus {
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.2);
        }

        .bounty-input::placeholder {
            color: rgba(211, 47, 47, 0.5);
        }

        .create-bounty-button {
            padding: 1.5vh 2.5vw;
            font-size: 1.2rem;
            font-weight: bold;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 0.5vw;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s, transform 0.1s;
        }

        .create-bounty-button:hover {
            background-color: #45a049;
        }

        .create-bounty-button:active {
            transform: scale(0.95);
        }

        /* --- Modal for History --- */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 2000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            overflow: auto; 
            background-color: rgba(0,0,0,0.5); 
            backdrop-filter: blur(3px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: #fefefe;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .close-modal {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-modal:hover,
        .close-modal:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        .history-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }
        .history-date {
            font-weight: bold;
            color: #2a5a2a;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        .history-tasks-list {
            list-style-type: none;
            padding-left: 10px;
        }
        .history-tasks-list li {
            padding: 2px 0;
            color: #555;
            font-size: 0.95rem;
        }
        .history-tasks-list li::before {
            content: "•";
            color: #4CAF50;
            display: inline-block; 
            width: 1em;
            margin-left: -1em;
        }
        .empty-history {
            text-align: center;
            color: #777;
            padding: 20px;
            font-style: italic;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .layout-container {
                width: 90vw;
                height: 95vh;
            }
            .sprite-logo {
                max-height: 15vh; 
            }
            .bounties-title-input {
                font-size: 1.6rem;
            }
            .bounty-popup {
                font-size: 1rem;
            }
            .bounty-input {
                font-size: 1rem;
            }
            .create-bounty-button {
                padding: 1.5vh 3vw;
                font-size: 1rem;
            }
            .red-line-text {
                font-size: 5vw;
            }
            .header-btn {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="background-container">
        <div class="scrolling-wrapper">
            <div class="scene-segment">
                <div class="bg-image"></div>
                <div class="red-line">
                    <div class="red-line-text">don't give up</div>
                </div>
            </div>
            <div class="scene-segment">
                <div class="bg-image"></div>
                <div class="red-line">
                    <div class="red-line-text">don't give up</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Layout Container -->
    <div class="layout-container">
        
        <div class="logo-section">
            <img src="https://raw.githubusercontent.com/lucky-dino-by/Chronicles-V0.0.1-/main/logo.png" alt="Chronicles Logo" class="sprite-logo">
        </div>

        <div class="center-square">
            <div class="bounties-header">
                <!-- Previous Day Button -->
                <button class="header-btn" id="prevDayBtn" title="Previous Days History">
                    <i class="fas fa-history"></i>
                </button>
                
                <input type="text" class="bounties-title-input" value="Active Bounties" id="bountiesTitle">
                
                <!-- Next Day Button -->
                <button class="header-btn" id="nextDayBtn" title="Next Day (Archive & Clear)">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
            
            <div class="bounties-container" id="bountiesContainer">
                <!-- Bounty popups will appear here -->
            </div>
            
            <div class="bounty-input-container">
                <input type="text" class="bounty-input" id="bountyInput" placeholder="New objective...">
                <button class="create-bounty-button" id="createBountyButton">
                    <i class="fas fa-plus"></i> Add
                </button>
            </div>
        </div>

    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2 style="margin-bottom: 15px; color:#333; text-align: center;">Previous Days</h2>
            <div id="historyList">
                <!-- History items injected here -->
            </div>
        </div>
    </div>

    <script>
        const createBountyButton = document.getElementById('createBountyButton');
        const bountyInput = document.getElementById('bountyInput');
        const bountiesContainer = document.getElementById('bountiesContainer');
        const prevDayBtn = document.getElementById('prevDayBtn');
        const nextDayBtn = document.getElementById('nextDayBtn');
        const historyModal = document.getElementById('historyModal');
        const closeModal = document.getElementById('closeModal');
        const historyList = document.getElementById('historyList');

        const STORAGE_KEY = 'chronicles_bounties';
        const HISTORY_KEY = 'chronicles_history';

        // Load bounties on startup
        window.addEventListener('load', loadBounties);

        // --- Core Bounty Logic ---
        createBountyButton.addEventListener('click', () => {
            const text = bountyInput.value.trim();
            if (text) {
                addBounty(text);
                bountyInput.value = '';
                bountyInput.focus();
            }
        });

        bountyInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                createBountyButton.click();
            }
        });

        function addBounty(text) {
            const bounty = {
                id: Date.now(),
                text: text,
                createdAt: new Date().toISOString()
            };

            const bounties = getStoredBounties();
            bounties.push(bounty);
            saveBounties(bounties);

            renderBountyElement(bounty);
            bountiesContainer.scrollTop = bountiesContainer.scrollHeight;
        }

        function renderBountyElement(bounty) {
            const popup = document.createElement('div');
            popup.className = 'bounty-popup';
            popup.dataset.id = bounty.id;
            
            const textSpan = document.createElement('span');
            textSpan.textContent = bounty.text;
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '<i class="fas fa-times"></i>';
            deleteBtn.onclick = function() {
                deleteBounty(bounty.id, popup);
            };

            popup.appendChild(textSpan);
            popup.appendChild(deleteBtn);
            bountiesContainer.appendChild(popup);
        }

        function deleteBounty(id, element) {
            element.style.transform = 'scale(0.9) opacity(0)';
            setTimeout(() => {
                element.remove();
            }, 200);
            const bounties = getStoredBounties().filter(b => b.id !== id);
            saveBounties(bounties);
        }

        function getStoredBounties() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : [];
        }

        function saveBounties(bounties) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(bounties));
        }

        function loadBounties() {
            const bounties = getStoredBounties();
            bounties.forEach(renderBountyElement);
        }

        // --- Next/Prev Day Logic ---

        // "Next Day" - Archives current list and clears it
        nextDayBtn.addEventListener('click', () => {
            const currentBounties = getStoredBounties();
            
            if (currentBounties.length === 0) {
                // If nothing to archive, maybe just a visual feedback?
                // For now, allow empty days or just clear logic.
                // Let's assume we allow clearing an empty day to start fresh if needed, 
                // but usually we archive only if there's data.
                // If user just wants to clear, they can use delete.
                // Let's assume this is "Finish Day".
            }

            // 1. Get History
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            
            // 2. Create Archive Entry
            const entry = {
                date: new Date().toLocaleString(), // Store formatted date string
                bounties: currentBounties
            };
            
            // 3. Add to history
            history.push(entry);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));

            // 4. Clear Current
            saveBounties([]);
            bountiesContainer.innerHTML = '';
            
            // Optional: visual feedback
            /* alert("Day archived! Starting a new day."); */
        });

        // "Previous Day" - Shows history modal
        prevDayBtn.addEventListener('click', () => {
            renderHistory();
            historyModal.style.display = 'flex';
        });

        closeModal.addEventListener('click', () => {
            historyModal.style.display = 'none';
        });

        window.addEventListener('click', (event) => {
            if (event.target == historyModal) {
                historyModal.style.display = 'none';
            }
        });

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            historyList.innerHTML = '';

            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-history">No past days saved yet.<br>Click the right arrow > to finish a day.</div>';
                return;
            }

            // Show newest first
            history.reverse().forEach(day => {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'history-item';
                
                const dateTitle = document.createElement('div');
                dateTitle.className = 'history-date';
                dateTitle.textContent = day.date;
                
                const ul = document.createElement('ul');
                ul.className = 'history-tasks-list';
                
                if (day.bounties && day.bounties.length > 0) {
                    day.bounties.forEach(b => {
                        const li = document.createElement('li');
                        li.textContent = b.text;
                        ul.appendChild(li);
                    });
                } else {
                    const li = document.createElement('li');
                    li.textContent = "No tasks recorded.";
                    li.style.fontStyle = 'italic';
                    ul.appendChild(li);
                }

                dayDiv.appendChild(dateTitle);
                dayDiv.appendChild(ul);
                historyList.appendChild(dayDiv);
            });
        }
    </script>
</body>
</html>
